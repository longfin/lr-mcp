[project]
name = "lr-mcp"
version = "0.1.0"
description = "MCP server for the Adobe Lightroom (cloud) Partner API: browse albums, filter and view photos, export renditions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3"]
keywords = ["mcp", "lightroom", "adobe", "photography", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
lr-mcp = "lr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
